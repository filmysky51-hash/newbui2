<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmysky</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjy34SzFABKNaF50DvBLeFHbjCjRqKfBLD0fmolpFBNbYQhdw7DBtadjYpkGheVCObdpH9eqvKlSOVR3usOvgRv_sTLUGs2XeCYf9dBch0Thf_gEOD4BCIHJw5yxoRv_HT_zSic9icIukLddZ2Qktx54sFh7g0o6FjIyflj5KXzlH6ssXOhgptqTP27-v0/s1600/download-removebg-preview.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Global Font Reset - Force Poppins everywhere */
    * {
      font-family: 'Poppins', sans-serif !important;
    }

    /* CRITICAL: Restore Font Awesome fonts for icons, overriding the global reset */
    .fas, .fa-solid {
        font-family: "Font Awesome 5 Free" !important;
        font-weight: 900;
    }
    .far, .fa-regular {
        font-family: "Font Awesome 5 Free" !important;
        font-weight: 400;
    }
    .fab, .fa-brands {
        font-family: "Font Awesome 5 Brands" !important;
        font-weight: 400;
    }
    .fa {
        font-family: "Font Awesome 5 Free" !important;
        font-weight: 900;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Hide scrollbar for Chrome, Safari and Opera */
    .content-slider::-webkit-scrollbar {
        display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .content-slider {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
    }

    .cast-slider::-webkit-scrollbar {
        display: none;
    }
    .cast-slider {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
    }

    [data-theme='Filmysky-dark'] {
        --bg-color: #10141f;
        --card-bg: #161d2f;
        --text-color: #ffffff;
        --secondary-text-color: #a0a6b5;
        --border-color: #2c354e;
        --primary-color: #00aaff;
    }
    [data-theme='classic-dark'] {
        --bg-color: #000000;
        --card-bg: #181818;
        --text-color: #ffffff;
        --secondary-text-color: #a0a6b5;
        --border-color: #282828;
        --primary-color: #e50914;
    }
    [data-theme='gradient-luxe'] {
        --bg-color: #0c0a1a;
        --card-bg: rgba(255, 255, 255, 0.1);
        --text-color: #ffffff;
        --secondary-text-color: #c0c0c0;
        --border-color: rgba(255, 255, 255, 0.2);
        --primary-color: #f72585;
    }
    [data-theme='minimal-light'] {
        --bg-color: #f4f4f4;
        --card-bg: #ffffff;
        --text-color: #121212;
        --secondary-text-color: #6c757d;
        --border-color: #e0e0e0;
        --primary-color: #e50914;
    }
    
    :root {
        --gold-color: #ffd700;
        --platinum-color: #e5e4e2;
        --diamond-color: #b9f2ff;
    }
  </style>

<link rel="stylesheet" href="/index.css">
</head>
<body data-theme="Filmysky-dark">
  <div id="root"></div>

  <script type="importmap">
  {
    "imports": {
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
      "react/": "https://aistudiocdn.com/react@^19.2.0/",
      "react": "https://aistudiocdn.com/react@^19.2.0",
      "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.5",
      "firebase/": "https://aistudiocdn.com/firebase@^12.5.0/"
    }
  }
  </script>

  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // Waiting for the 'load' event is the most robust way to avoid registration errors.
      window.addEventListener('load', function() {
        // Use an absolute path from the root. This is the most reliable way.
        navigator.serviceWorker.register('/firebase-messaging-sw.js').then(function(registration) {
          console.log('Service Worker registration successful with scope: ', registration.scope);
        }, function(err) {
          console.log('Service Worker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
